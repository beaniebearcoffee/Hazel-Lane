<title>Hazel &amp; Lane Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14120F;
  --surface:#1D1A16;
  --surface-2:#262019;
  --surface-3:#2F2820;
  --line:#3A3226;
  --line-soft:#2A241C;
  --paper:#EDE6D9;
  --paper-dim:#A99C89;
  --paper-faint:#786C5B;
  --accent:#C98A3A;
  --accent-bright:#E0A550;
  --accent-deep:#8F5F22;
  --accent-soft:rgba(201,138,58,0.14);
  --good:#8CA37A;
  --good-soft:rgba(140,163,122,0.16);
  --info:#8CA0AE;
  --info-soft:rgba(140,160,174,0.16);
  --danger:#C1614A;
  --danger-soft:rgba(193,97,74,0.16);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,0.55);
  --shadow-sm:0 8px 24px -8px rgba(0,0,0,0.4);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.08;text-wrap:balance;margin:0;}
p{margin:0;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent-bright);
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--accent);display:inline-block;}
.container{max-width:1180px;margin:0 auto;padding:0 32px;}
@media (max-width:640px){.container{padding:0 20px;}}
::selection{background:var(--accent);color:var(--ink);}
:focus-visible{outline:2px solid var(--accent-bright);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- Nav ---------- */
.site-nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(20,18,15,0.82);
  backdrop-filter:blur(10px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
.site-nav .row{display:flex;align-items:center;justify-content:space-between;height:78px;}
.wordmark{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:22px;letter-spacing:.01em;}
.wordmark b{font-style:normal;font-weight:600;color:var(--accent-bright);}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-links a{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper-dim);padding:10px 14px;border-radius:2px;transition:color .2s var(--ease);
  position:relative;
}
.nav-links a:hover{color:var(--paper);}
.nav-links a.active{color:var(--accent-bright);}
.nav-links a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--accent);}
.nav-links .perf{width:4px;height:4px;border-radius:50%;background:var(--line);margin:0 2px;}
.nav-cta{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--accent);color:var(--ink);padding:11px 18px;border-radius:2px;font-weight:600;
  transition:background .2s var(--ease),transform .2s var(--ease);
}
.nav-cta:hover{background:var(--accent-bright);transform:translateY(-1px);}
.nav-toggle{display:none;background:none;border:1px solid var(--line);color:var(--paper);padding:8px 10px;border-radius:2px;}
@media (max-width:860px){
  .nav-links{display:none;}
  .nav-toggle{display:block;}
  .nav-cta{display:none;}
}
.mobile-menu{position:fixed;inset:78px 0 0 0;background:var(--ink);z-index:199;padding:24px 20px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-soft);}
.mobile-menu[hidden]{display:none;}
.mobile-menu a{font-family:var(--font-mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);padding:16px 4px;border-bottom:1px solid var(--line-soft);}
.mobile-menu a.active{color:var(--accent-bright);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:14px 24px;border-radius:2px;border:1px solid transparent;transition:all .2s var(--ease);white-space:nowrap;
}
.btn-primary{background:var(--accent);color:var(--ink);}
.btn-primary:hover{background:var(--accent-bright);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--paper);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-bright);}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}
.btn-sm{padding:9px 14px;font-size:11px;}

/* ---------- Hero ---------- */
.hero{position:relative;height:88vh;min-height:560px;overflow:hidden;background:var(--ink);}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease);}
.hero-slide.active{opacity:1;}
.hero-slide svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-slide .art{position:absolute;inset:0;width:100%;height:100%;transform:scale(1.06);animation:kenburns 9s var(--ease) forwards;}
@keyframes kenburns{from{transform:scale(1.1);}to{transform:scale(1);}}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,.15) 0%,rgba(20,18,15,.35) 45%,rgba(20,18,15,.92) 100%);}
.hero-frame{position:absolute;inset:18px;border:1px solid rgba(237,230,217,0.22);pointer-events:none;z-index:5;}
.hero-frame i{position:absolute;width:18px;height:18px;border:2px solid var(--accent-bright);}
.hero-frame i.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.hero-frame i.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;}
.hero-frame i.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;}
.hero-frame i.br{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.hero-content{position:relative;z-index:6;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 76px;}
.hero-content .container{width:100%;}
.hero-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-bright);margin-bottom:18px;}
.hero-title{font-size:clamp(38px,6vw,74px);color:var(--paper);max-width:820px;}
.hero-sub{margin-top:18px;font-size:17px;color:var(--paper-dim);max-width:480px;}
.hero-actions{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
.hero-meta{position:absolute;z-index:6;left:14px;bottom:8px;display:flex;gap:0;align-items:center;}
.hero-dot{width:38px;height:38px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;}
.hero-dot::before{content:"";display:block;width:22px;height:2px;background:var(--line);transition:background .2s,width .2s;}
.hero-dot.active::before{background:var(--accent-bright);width:34px;}
.hero-counter{position:absolute;z-index:6;right:32px;bottom:26px;font-family:var(--font-mono);font-size:12px;color:var(--paper-dim);letter-spacing:.05em;}
.hero-counter b{color:var(--paper);}
@media (max-width:640px){.hero-content{padding-bottom:56px;}.hero-actions{width:100%;}.hero-actions .btn{flex:1;}}

/* ---------- Sections ---------- */
.section{padding:96px 0;}
.section-tight{padding:64px 0;}
.section-head{max-width:640px;margin-bottom:52px;}
.section-head h2{font-size:clamp(30px,4vw,44px);margin-top:16px;}
.section-head p{margin-top:16px;color:var(--paper-dim);font-size:16px;max-width:520px;}
.divider{height:1px;background:var(--line);border:none;margin:0;}

/* category tiles */
.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--line);border:1px solid var(--line);}
.cat-tile{position:relative;aspect-ratio:3/4;background:var(--surface);overflow:hidden;}
.cat-tile svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s var(--ease);}
.cat-tile:hover svg{transform:scale(1.08);}
.cat-tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(20,18,15,.92) 100%);}
.cat-tile .label{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;}
.cat-tile .label .n{font-family:var(--font-mono);font-size:10px;color:var(--accent-bright);letter-spacing:.1em;}
.cat-tile .label .t{font-family:var(--font-display);font-size:17px;margin-top:4px;color:var(--paper);}
@media (max-width:900px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:520px){.cat-grid{grid-template-columns:repeat(2,1fr);}}

/* testimonials */
.testi-strip{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.testi-card{padding:44px 38px;border-right:1px solid var(--line);}
.testi-card:last-child{border-right:none;}
.testi-quote{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--paper);line-height:1.5;}
.testi-attr{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
.testi-name{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--accent-bright);text-transform:uppercase;}
.testi-role{font-size:13px;color:var(--paper-faint);}
@media (max-width:860px){.testi-grid{grid-template-columns:1fr;}.testi-card{border-right:none;border-bottom:1px solid var(--line);}}

/* footer */
.site-footer{background:var(--ink);border-top:1px solid var(--line);padding:64px 0 32px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;}
.footer-col h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:16px;}
.footer-col a,.footer-col p{display:block;color:var(--paper-dim);font-size:14px;margin-bottom:10px;}
.footer-col a:hover{color:var(--accent-bright);}
.footer-bottom{margin-top:56px;padding-top:24px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer-bottom small{color:var(--paper-faint);font-size:12.5px;font-family:var(--font-mono);}
.social-row{display:flex;gap:16px;}
.social-row a{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-dim);}
.social-row a:hover{color:var(--accent-bright);}
@media (max-width:860px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:480px){.footer-grid{grid-template-columns:1fr;gap:28px;}}

/* ---------- Page header (interior pages) ---------- */
.page-hero{padding:168px 0 64px;border-bottom:1px solid var(--line);}
.page-hero h1{font-size:clamp(34px,5vw,56px);margin-top:16px;}
.page-hero p{margin-top:18px;color:var(--paper-dim);max-width:560px;font-size:16px;}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:start;}
@media (max-width:800px){.about-grid{grid-template-columns:1fr;gap:32px;}.about-portrait{max-width:320px;margin:0 auto;}}
.about-portrait{border:1px solid var(--line);position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface);}
.about-portrait svg{width:100%;height:100%;}
.about-copy p{color:var(--paper-dim);margin-bottom:18px;font-size:16px;line-height:1.75;}
.about-copy p:first-of-type{color:var(--paper);font-size:19px;font-family:var(--font-display);font-style:italic;line-height:1.5;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border:1px solid var(--line);margin-top:40px;}
@media (max-width:480px){.stat-row{grid-template-columns:1fr;}}
.stat{background:var(--surface);padding:22px 20px;}
.stat b{font-family:var(--font-display);font-size:30px;display:block;color:var(--accent-bright);}
.stat span{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);}
.process-list{margin-top:56px;display:flex;flex-direction:column;}
.process-item{display:grid;grid-template-columns:70px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--line);}
.process-item:last-child{border-bottom:1px solid var(--line);}
.process-num{font-family:var(--font-mono);font-size:13px;color:var(--accent-bright);padding-top:4px;}
.process-item h3{font-size:19px;margin-bottom:8px;}
.process-item p{color:var(--paper-dim);font-size:15px;max-width:520px;}

/* ---------- Portfolio ---------- */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px;}
.filter-btn{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:10px 16px;border:1px solid var(--line);border-radius:2px;color:var(--paper-dim);background:transparent;transition:all .18s var(--ease);
}
.filter-btn:hover{color:var(--paper);border-color:var(--paper-faint);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600;}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.frame{cursor:pointer;}
.frame-art{position:relative;border:1px solid var(--line);aspect-ratio:4/5;overflow:hidden;background:var(--surface);}
.frame-art svg,.frame-art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease);}
.frame:hover .frame-art svg,.frame:hover .frame-art img{transform:scale(1.05);}
.frame-art .no{position:absolute;top:10px;left:10px;font-family:var(--font-mono);font-size:10px;color:rgba(237,230,217,.8);background:rgba(20,18,15,.55);padding:3px 7px;letter-spacing:.05em;}
.frame-art .plus{position:absolute;bottom:10px;right:10px;width:26px;height:26px;border:1px solid rgba(237,230,217,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:14px;opacity:0;transition:opacity .2s;background:rgba(20,18,15,.4);}
.frame:hover .plus{opacity:1;}
.frame-cap{margin-top:10px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--paper-faint);letter-spacing:.03em;}
.frame-cap b{color:var(--paper-dim);font-weight:500;}
@media (max-width:960px){.sheet-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.sheet-grid{grid-template-columns:1fr;}.sheet-grid .frame-art{aspect-ratio:5/4;}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:400;background:rgba(10,9,7,0.96);display:flex;align-items:center;justify-content:center;padding:24px;}
.lightbox-inner{max-width:920px;width:100%;}
.lightbox-art{border:1px solid var(--line-soft);max-height:72vh;overflow:hidden;background:var(--surface);}
.lightbox-art svg,.lightbox-art img{width:100%;height:100%;max-height:72vh;object-fit:cover;display:block;}
.lightbox-cap{display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px;gap:20px;flex-wrap:wrap;}
.lightbox-cap h3{font-size:20px;}
.lightbox-cap .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-faint);margin-top:6px;letter-spacing:.03em;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper);background:rgba(20,18,15,.5);font-size:18px;transition:all .2s;}
.lightbox-nav:hover{border-color:var(--accent);color:var(--accent-bright);}
.lightbox-prev{left:24px;}
.lightbox-next{right:24px;}
.lightbox-close{position:absolute;top:24px;right:24px;color:var(--paper);font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;}
.lightbox-close:hover{border-color:var(--accent);color:var(--accent-bright);}
@media (max-width:720px){.lightbox-nav{width:38px;height:38px;font-size:15px;}.lightbox-prev{left:8px;}.lightbox-next{right:8px;}.lightbox-close{right:8px;top:8px;}}

/* ---------- Forms ---------- */
.field{margin-bottom:20px;}
.field label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:9px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--paper);
  padding:13px 14px;font-family:var(--font-body);font-size:15px;border-radius:2px;transition:border-color .18s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;}
.field textarea{resize:vertical;min-height:100px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.date-select-row{display:flex;gap:10px;}
.date-select-row select{flex:1 1 0;width:auto;min-width:0;}
.date-select-row select:disabled{opacity:.4;}
@media (max-width:640px){.field-row{grid-template-columns:1fr;}}
.field-hint{font-size:12.5px;color:var(--paper-faint);margin-top:7px;}
.field-error{font-size:12.5px;color:var(--danger);margin-top:7px;}

/* ---------- Contact page ---------- */
.contact-grid{display:grid;grid-template-columns:1fr .7fr;gap:64px;align-items:start;}
.contact-side{border-left:1px solid var(--line);padding-left:40px;}
.contact-side .item{margin-bottom:30px;}
.contact-side .item h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:8px;}
.contact-side .item div,.contact-side .item a{font-size:16px;color:var(--paper);}
.contact-side .item a:hover{color:var(--accent-bright);}
@media (max-width:900px){.contact-grid{grid-template-columns:1fr;}.contact-side{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:32px;}}
.form-msg{padding:16px 18px;border:1px solid var(--good);background:var(--good-soft);color:var(--paper);font-size:14.5px;margin-bottom:24px;border-radius:2px;}

/* ---------- Booking ---------- */
.wizard{border:1px solid var(--line);background:var(--surface);}
.wizard-head{display:flex;justify-content:space-between;align-items:center;padding:26px 32px;border-bottom:1px solid var(--line);}
.wizard-steps{display:flex;gap:6px;}
.wizard-step-dot{width:30px;height:2px;background:var(--line);}
.wizard-step-dot.done{background:var(--accent);}
.wizard-step-dot.current{background:var(--accent-bright);}
.wizard-label{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-faint);letter-spacing:.06em;text-transform:uppercase;}
.wizard-body{padding:40px 32px;}
.wizard-foot{display:flex;justify-content:space-between;padding:24px 32px;border-top:1px solid var(--line);}
.session-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (max-width:640px){.session-grid{grid-template-columns:1fr;}}
.session-card{border:1px solid var(--line);padding:20px;text-align:left;background:var(--surface-2);border-radius:2px;transition:all .18s;}
.session-card:hover{border-color:var(--paper-faint);}
.session-card.selected{border-color:var(--accent);background:var(--accent-soft);}
.session-card .t{font-family:var(--font-display);font-size:18px;color:var(--paper);}
.session-card .p{font-family:var(--font-mono);font-size:12px;color:var(--accent-bright);margin-top:6px;}
.session-card .d{font-size:13.5px;color:var(--paper-dim);margin-top:8px;}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
@media (max-width:520px){.slot-grid{grid-template-columns:repeat(2,1fr);}}
.slot-btn{border:1px solid var(--line);padding:12px;font-family:var(--font-mono);font-size:13px;color:var(--paper-dim);background:var(--surface-2);border-radius:2px;}
.slot-btn:hover:not(:disabled){border-color:var(--paper-faint);color:var(--paper);}
.slot-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--paper);}
.slot-btn:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed;}
.loc-toggle{display:flex;gap:2px;background:var(--line);border:1px solid var(--line);width:fit-content;}

/* Resize + compress an uploaded photo client-side, return a data URI */
function processImageFile(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read_error")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode_error")); };
      img.onload = function(){
        var maxDim = 1600;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale)), ch = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function publishSite(){

  var serialized = JSON.stringify(CUSTOM_PORTFOLIO);
  if(serialized.length > 12000000){ return {ok:false, reason:"too_large"}; }
  if(!window.claude || typeof window.claude.use!=="function") return {ok:false, reason:"unsupported"};
  var api;
  try { api = await window.claude.use("artifact"); } catch(e){ api = null; }
  if(!api) return {ok:false, reason:"unavailable"};
  store.textContent = serialized;
  try {
    var html = "<!doctype html>\n" + document.documentElement.outerHTML;
    await api.publish(html);
    return {ok:true};
  } catch(e){
    return {ok:false, reason:(e && e.code) || "error", message:(e && e.message) || ""};
  }
}
function publishStatusMessage(res){

var heroTimerId = null;
function initHero(){
  if(heroTimerId){ clearInterval(heroTimerId); heroTimerId = null; }
  var root = $("#hero"); if(!root) return;
  var i = 0;
  var slides = $all(".hero-slide", root);
  var dots = $all(".hero-dot", root);
  function show(idx){
    slides.forEach(function(s,k){ s.classList.toggle("active", k===idx); });
    dots.forEach(function(d,k){ d.classList.toggle("active", k===idx); });
    $("#heroEyebrow").textContent = HERO_SLIDES[idx].eyebrow;
    $("#heroTitle").textContent = HERO_SLIDES[idx].title;
    $("#heroSub").textContent = HERO_SLIDES[idx].sub;
    $("#heroCounterNum").textContent = pad(idx+1,2);
    i = idx;
  }
  function next(){
    if(!document.getElementById("hero")){ clearInterval(heroTimerId); heroTimerId=null; return; }
    show((i+1)%slides.length);
  }
  function restart(){ if(heroTimerId) clearInterval(heroTimerId); heroTimerId=setInterval(next,6500); }
  dots.forEach(function(d){ d.addEventListener("click",function(){ show(parseInt(d.dataset.i,10)); restart(); }); });
  restart();
}

/* lightbox */
var lightboxItems = [], lightboxIndex = 0;
function openLightbox(id){
  lightboxItems = currentPortfolioItems();
  lightboxIndex = lightboxItems.findIndex(function(p){return p.id===id;});
  if(lightboxIndex<0) lightboxIndex=0;
  renderLightbox();
}
function renderLightbox(){
  var existing = $(".lightbox"); if(existing) existing.remove();
  var p = lightboxItems[lightboxIndex]; if(!p) return;
  var catLabel = CATEGORIES.find(function(c){return c.id===p.category;}).label;
  var media = p.photo ? '<img src="'+p.img+'" alt="'+esc(p.title)+'">' : svgArt(p.category,p.seed,1000,800);
  var div = document.createElement("div");
  div.className = "lightbox";
  div.innerHTML = ''+
    '<button class="lightbox-nav lightbox-prev" aria-label="Previous">‹</button>'+
    '<div class="lightbox-inner">'+
      '<div class="lightbox-art">'+media+'</div>'+
      '<div class="lightbox-cap"><div><h3>'+esc(p.title)+'</h3><div class="meta">'+catLabel+' · '+esc(p.location)+' · Frame No. '+pad(lightboxIndex+1,3)+'</div></div></div>'+
    '</div>'+
    '<button class="lightbox-nav lightbox-next" aria-label="Next">›</button>'+
    '<button class="lightbox-close" aria-label="Close">×</button>';
  document.body.appendChild(div);
  div.addEventListener("click", function(e){
    if(e.target===div || e.target.classList.contains("lightbox-close")) closeLightbox();
    else if(e.target.classList.contains("lightbox-prev")) step(-1);
    else if(e.target.classList.contains("lightbox-next")) step(1);
  });
  document.addEventListener("keydown", lightboxKeyHandler);
}
function step(dir){ lightboxIndex = (lightboxIndex+dir+lightboxItems.length)%lightboxItems.length; renderLightbox(); }
function closeLightbox(){ var el=$(".lightbox"); if(el) el.remove(); document.removeEventListener("keydown", lightboxKeyHandler); }
function lightboxKeyHandler(e){ if(e.key==="Escape") closeLightbox(); else if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1); }

function renderWizardShell(){
  var total = 4;
  var dots = "";
  for(var s=1;s<=total;s++){ dots += '<div class="wizard-step-dot '+(s<wizard.step?"done":(s===wizard.step?"current":""))+'"></div>'; }

  return '<div class="wizard">'+
    '<div class="wizard-head"><span class="wizard-label">Step 0'+wizard.step+' / 0'+total+' — '+stepNames[wizard.step-1]+'</span><div class="wizard-steps">'+dots+'</div></div>'+

    '<div class="wizard-foot">'+
      '<button class="btn btn-ghost" id="wizBack" '+(wizard.step===1?"disabled":"")+'>Back</button>'+
      (wizard.step<total ? '<button class="btn btn-primary" id="wizNext" '+(canAdvance()?"":"disabled")+'>Next</button>' : '<button class="btn btn-primary" id="wizSubmit" '+(canAdvance()?"":"disabled")+'>Request My Quote</button>')+
    '</div>'+
  '</div>';
}
function canAdvance(){
  if(wizard.step===1) return !!wizard.sessionType;
  if(wizard.step===2) return !!(wizard.date && wizard.time);
  if(wizard.step===3) return wizard.locType==="studio" || (wizard.locType==="onlocation" && wizard.locDetail.trim().length>2);
  if(wizard.step===4) return !!(wizard.name.trim() && /\S+@\S+\.\S+/.test(wizard.email));
  return false;
}
function renderWizardStep(){
  if(wizard.step===1){
    return '<div class="session-grid">'+SESSION_TYPES.map(function(s){
      return '<button type="button" class="session-card'+(wizard.sessionType===s.id?" selected":"")+'" data-session="'+s.id+'">'+

      '</button>';
    }).join("")+'</div>';
  }
  if(wizard.step===2){
    var cutoff = addDaysISO(todayISO(),7);
    var cutoffY = parseInt(cutoff.slice(0,4),10), cutoffM = parseInt(cutoff.slice(5,7),10), cutoffD = parseInt(cutoff.slice(8,10),10);
    if(wizard.dsel.y===null) wizard.dsel.y = cutoffY;
    var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var years = [cutoffY, cutoffY+1, cutoffY+2];
    var selY = wizard.dsel.y, selM = wizard.dsel.m, selD = wizard.dsel.d;
    var validMonths = [];
    for(var m=1;m<=12;m++){ if(selY>cutoffY || (selY===cutoffY && m>=cutoffM)) validMonths.push(m); }
    var dayCount = selM ? daysInMonth(selY,selM) : 0;
    var validDays = [];
    for(var d=1;d<=dayCount;d++){
      if(selY>cutoffY || selM>cutoffM || (selY===cutoffY && selM===cutoffM && d>=cutoffD)) validDays.push(d);

    var monthHtml = '<select id="selMonth"><option value="">Month</option>'+validMonths.map(function(m){return '<option value="'+m+'"'+(m===selM?" selected":"")+'>'+monthNames[m-1]+'</option>';}).join("")+'</select>';
    var dayHtml = '<select id="selDay" '+(!selM?"disabled":"")+'><option value="">Day</option>'+validDays.map(function(d){return '<option value="'+d+'"'+(d===selD?" selected":"")+'>'+d+'</option>';}).join("")+'</select>';
    var slotsHtml = "";
    if(wizard.date){
      var taken = bookedSlotsFor(wizard.date);
      slotsHtml = '<div class="slot-grid">'+SLOTS.map(function(t){
        var isTaken = taken.indexOf(t)>=0;
        return '<button type="button" class="slot-btn'+(wizard.time===t?" selected":"")+'" data-slot="'+t+'" '+(isTaken?"disabled":"")+'>'+t+(isTaken?" · Booked":"")+'</button>';
      }).join("")+'</div>';
    }
    return '<div class="field"><label>Preferred Date — bookings open one week out</label><div class="date-select-row">'+monthHtml+dayHtml+yearHtml+'</div>'+
        '<div class="field-hint">Choose month, day, and year — any date starting '+fmtDateLong(cutoff)+' is open.</div></div>'+
      (wizard.date ? '<div class="field"><label>Available Times — '+fmtDateLong(wizard.date)+'</label>'+slotsHtml+'</div>' : '<p class="field-hint">Finish choosing a date above to see available times.</p>');
  }
  if(wizard.step===3){
    return '<div class="field"><label>Location Type</label><div class="loc-toggle">'+
        '<button type="button" data-loc="studio" class="'+(wizard.locType==="studio"?"active":"")+'">In-Studio</button>'+
        '<button type="button" data-loc="onlocation" class="'+(wizard.locType==="onlocation"?"active":"")+'">On-Location</button>'+
      '</div></div>'+
      (wizard.locType==="onlocation" ?
        '<div class="field"><label>Location Address / Description</label><input type="text" id="locDetail" placeholder="e.g. Cannon Beach, near Haystack Rock" value="'+escapeAttr(wizard.locDetail)+'"><div class="field-hint">Travel outside the Portland metro may include a travel fee — this will show on your quote, never charged automatically.</div></div>'
        : '<p class="field-hint">Sessions are shot at the Hazel &amp; Lane studio in '+BRAND.city+'.</p>');
  }
  return '<div class="field-row">'+
      '<div class="field"><label>Full Name</label><input type="text" id="fName" value="'+escapeAttr(wizard.name)+'" placeholder="Your name"></div>'+
      '<div class="field"><label>Email</label><input type="email" id="fEmail" value="'+escapeAttr(wizard.email)+'" placeholder="you@email.com"></div>'+
    '</div>'+
    '<div class="field"><label>Phone (optional)</label><input type="tel" id="fPhone" value="'+escapeAttr(wizard.phone)+'" placeholder="(555) 555-0100"></div>'+
    '<div class="field"><label>Anything we should know? (optional)</label><textarea id="fNotes" placeholder="Number of people, vision for the session, must-have shots...">'+esc(wizard.notes)+'</textarea></div>'+
    '<div class="review-list">'+
      '<div class="review-row"><span>Session</span><span>'+(sessionById(wizard.sessionType)||{label:"—"}).label+'</span></div>'+
      '<div class="review-row"><span>Date</span><span>'+(wizard.date?fmtDateLong(wizard.date):"—")+'</span></div>'+
      '<div class="review-row"><span>Time</span><span>'+(wizard.time||"—")+'</span></div>'+
      '<div class="review-row"><span>Location</span><span>'+(wizard.locType==="studio"?"In-Studio":(wizard.locDetail||"On-Location"))+'</span></div>'+
    '</div>';
}
function renderConfirm(){
  return '<div class="wizard"><div class="confirm-panel">'+
    '<div class="eyebrow" style="justify-content:center;">Request received</div>'+
    '<h2 style="margin-top:16px;">Thanks, '+esc(wizard.name.split(" ")[0]||"there")+'.</h2>'+
    '<p style="color:var(--paper-dim);margin-top:12px;max-width:440px;margin-left:auto;margin-right:auto;">Your booking request is in. Save this confirmation code — you\'ll use it with your email to check your quote status.</p>'+
    '<div class="confirm-code">'+wizard.code+'</div>'+
    '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;">'+
      '<a href="#/my-quote" class="btn btn-primary" id="goMyQuote">Check My Quote</a>'+
      '<a href="#/" class="btn btn-ghost">Back to Home</a>'+
    '</div>'+
  '</div></div>';
}
function initBooking(){
  var body = $("#wizardBody"); if(!body && !wizard.done) return;
  if(wizard.done){
    return;
  }
  $("#wizBack") && $("#wizBack").addEventListener("click", function(){ if(wizard.step>1){ wizard.step--; rerenderWizard(); } });
  $("#wizNext") && $("#wizNext").addEventListener("click", function(){ if(canAdvance() && wizard.step<4){ wizard.step++; rerenderWizard(); } });
  $("#wizSubmit") && $("#wizSubmit").addEventListener("click", function(){
    if(!canAdvance()) return;
    var rec = {
      id: makeBookingId(),
      createdAt: new Date().toISOString(),
      sessionType: wizard.sessionType,
      date: wizard.date, time: wizard.time,
      locationType: wizard.locType, locationDetail: wizard.locType==="onlocation"?wizard.locDetail:"",
      name: wizard.name, email: wizard.email, phone: wizard.phone, notes: wizard.notes,
      status: "pending", quote: null
    };
    upsertBooking(rec);
    wizard.done = true; wizard.code = rec.id;
    render();
  });
  body.addEventListener("click", function(e){
    var sc = e.target.closest(".session-card");
    if(sc){ wizard.sessionType = sc.dataset.session; rerenderWizard(); return; }
    var sb = e.target.closest(".slot-btn");
    if(sb && !sb.disabled){ wizard.time = sb.dataset.slot; rerenderWizard(); return; }
    var lb = e.target.closest("[data-loc]");
    if(lb){ wizard.locType = lb.dataset.loc; rerenderWizard(); return; }
  });
  var selYear = $("#selYear"), selMonth = $("#selMonth"), selDay = $("#selDay");
  if(selYear){ selYear.addEventListener("change", function(){ wizard.dsel.y=parseInt(selYear.value,10); wizard.dsel.m=null; wizard.dsel.d=null; updateWizardDateFromSel(); rerenderWizard(); }); }
  if(selMonth){ selMonth.addEventListener("change", function(){ wizard.dsel.m=selMonth.value?parseInt(selMonth.value,10):null; wizard.dsel.d=null; updateWizardDateFromSel(); rerenderWizard(); }); }
  if(selDay){ selDay.addEventListener("change", function(){ wizard.dsel.d=selDay.value?parseInt(selDay.value,10):null; updateWizardDateFromSel(); rerenderWizard(); }); }
  var locDetail = $("#locDetail");
  if(locDetail){ locDetail.addEventListener("input", function(){ wizard.locDetail=locDetail.value; syncFoot(); }); }
  ["fName","fEmail","fPhone","fNotes"].forEach(function(id){
    var el = $("#"+id); if(!el) return;
    el.addEventListener("input", function(){
      if(id==="fName") wizard.name=el.value;
      if(id==="fEmail") wizard.email=el.value;
      if(id==="fPhone") wizard.phone=el.value;
      if(id==="fNotes") wizard.notes=el.value;
      syncFoot();
    });
  });
}
function rerenderWizard(){
  var container = $(".wizard"); if(!container) return;
  container.outerHTML = renderWizardShell();
  initBooking();
}
function syncFoot(){
  var nextBtn = $("#wizNext"); var subBtn = $("#wizSubmit");
  var ok = canAdvance();
  if(nextBtn) nextBtn.disabled = !ok;
  if(subBtn) subBtn.disabled = !ok;
}

function renderQuoteDetail(b){
  var s = sessionById(b.sessionType);
  var pillClass = "pill-"+b.status;
  var q = b.quote;
  return '<div class="quote-detail" style="max-width:640px;">'+
    '<div class="quote-detail-head"><div><div class="eyebrow" style="margin-bottom:8px;">'+b.id+'</div><h3 style="font-size:22px;">'+s.label+' Session</h3></div><span class="pill '+pillClass+'">'+b.status+'</span></div>'+
    '<div class="quote-detail-body">'+
      '<div class="subsection-title">Booking Details</div>'+
      '<div class="info-line"><span>Date</span><b>'+fmtDateLong(b.date)+'</b></div>'+
      '<div class="info-line"><span>Time</span><b>'+b.time+'</b></div>'+
      '<div class="info-line"><span>Location</span><b>'+(b.locationType==="studio"?"In-Studio":esc(b.locationDetail))+'</b></div>'+
      (q ? (
        '<div class="subsection-title">Your Quote</div>'+
        (q.message ? '<div class="quote-msg">"'+esc(q.message)+'"</div>' : "")+
        '<div class="review-list">'+
          '<div class="review-row"><span>Session Fee</span><span>'+fmt$(q.price)+'</span></div>'+
          (q.travelFee>0 ? '<div class="review-row"><span>Travel Fee</span><span>'+fmt$(q.travelFee)+'</span></div>' : "")+
          (q.discountPct>0 ? '<div class="review-row"><span>Discount ('+q.discountPct+'%)</span><span>−'+fmt$((q.price+q.travelFee)*q.discountPct/100)+'</span></div>' : "")+
          '<div class="review-row"><span>Tax ('+q.taxPct+'%)</span><span>'+fmt$(quoteTax(q))+'</span></div>'+
          '<div class="review-row" style="font-weight:600;color:var(--paper);"><span>Total</span><span>'+fmt$(quoteTotal(q))+'</span></div>'+
        '</div>'+
        (b.status==="quoted" ? '<div style="display:flex;gap:12px;margin-top:24px;"><button class="btn btn-primary" id="acceptQuote">Accept Quote</button><button class="btn btn-ghost" id="declineQuote">Decline</button></div>' : "")
      ) : "")+
      (b.status==="pending" ? '<div class="form-msg" style="margin-top:24px;background:var(--info-soft);border-color:var(--info);">Your request is being reviewed. A custom quote typically arrives within 1–2 business days — check back here anytime.</div>' : "")+
      (b.status==="accepted" ? '<div class="form-msg" style="margin-top:24px;">Quote accepted — we\'ll be in touch to finalize details before your session.</div>' : "")+
      (b.status==="declined" ? '<div class="form-msg" style="margin-top:24px;background:var(--danger-soft);border-color:var(--danger);">This request was declined. Reach out via the contact page if you\'d like to revisit it.</div>' : "")+
      '<button class="btn btn-ghost" id="lookupAnother" style="margin-top:32px;">Look Up Another Booking</button>'+
    '</div>'+
  '</div>';
}
function quoteTax(q){ var sub=(q.price+q.travelFee)*(1-q.discountPct/100); return sub*q.taxPct/100; }
function quoteTotal(q){ var sub=(q.price+q.travelFee)*(1-q.discountPct/100); return sub + sub*q.taxPct/100; }
function initMyQuote(){
  var sub = $("#lookupSubmit");
  if(sub){ sub.addEventListener("click", function(){
    var code = $("#lookupCode").value.trim().toUpperCase();
    var email = $("#lookupEmail").value.trim().toLowerCase();
    myQuote.code = code; myQuote.email = email;
    var b = findBooking(code);
    if(!b || b.email.toLowerCase()!==email){ myQuote.error="No booking found matching that code and email."; myQuote.found=null; }
    else { myQuote.error=""; myQuote.found=b; }
    rerenderMyQuote();
  }); }
  var again = $("#lookupAnother");
  if(again){ again.addEventListener("click", function(){ myQuote.found=null; myQuote.error=""; rerenderMyQuote(); }); }
  var accept = $("#acceptQuote");
  if(accept){ accept.addEventListener("click", function(){ myQuote.found.status="accepted"; upsertBooking(myQuote.found); rerenderMyQuote(); }); }
  var decline = $("#declineQuote");
  if(decline){ decline.addEventListener("click", function(){ myQuote.found.status="declined"; upsertBooking(myQuote.found); rerenderMyQuote(); }); }
}
function rerenderMyQuote(){
  var section = document.querySelector("main .section-tight .container");
  if(!section) return;
  section.innerHTML = myQuote.found ? renderQuoteDetail(myQuote.found) : renderLookupForm();
  initMyQuote();
}

    }).join("")+'</div>' : '<p class="field-hint" style="margin-top:16px;">No custom photos added yet — the portfolio page is showing sample placeholder frames until you add some.</p>')+

function renderDrawer(b){

  var q = b.quote || { price:s.base, travelFee:0, discountPct:0, taxPct:8, message:"" };
  return '<div class="drawer-back" id="drawerBack"></div>'+

      '<div class="field"><label>Travel Fee ($)</label><input type="number" id="qTravel" value="'+q.travelFee+'" min="0" step="5"></div></div>'+
      '<div class="field-row"><div class="field"><label>Discount (%)</label><input type="number" id="qDiscount" value="'+q.discountPct+'" min="0" max="100" step="1"></div>'+
      '<div class="field"><label>Tax (%)</label><input type="number" id="qTax" value="'+q.taxPct+'" min="0" max="30" step="0.5"></div></div>'+
      '<div class="field"><label>Message to Client</label><textarea id="qMessage" placeholder="A short note that appears with the quote...">'+esc(q.message)+'</textarea></div>'+

function computeCalc(){
  var price=parseFloat($("#qPrice").value)||0, travel=parseFloat($("#qTravel").value)||0;
  var disc=parseFloat($("#qDiscount").value)||0, tax=parseFloat($("#qTax").value)||0;
  var sub=(price+travel)*(1-disc/100);
  var taxAmt=sub*tax/100;
  $("#calcSub").textContent=fmt$(sub);
  $("#calcTax").textContent=fmt$(taxAmt);
  $("#calcTotal").textContent=fmt$(sub+taxAmt);
}
function initAdminDashboard(){
  var logout = $("#adminLogout");
  if(logout) logout.addEventListener("click", function(){ sessionStorage.removeItem(SS_ADMIN); render(); });
  $all(".booking-table tr.clickable").forEach(function(tr){
    tr.addEventListener("click", function(){ openDrawerId = tr.dataset.id; rerenderAdmin(); });
  });
  initDrawer();
  initPhotoManager();
}
function initPhotoManager(){
  var submit = $("#pfSubmit");
  if(submit){ submit.addEventListener("click", function(){
    var fileInput = $("#pfFile");
    var file = fileInput && fileInput.files && fileInput.files[0];
    var statusEl = $("#pfStatus");
    if(!file){ statusEl.textContent = "Choose a photo file first."; statusEl.className = "publish-status err"; return; }
    submit.disabled = true;
    statusEl.className = "publish-status";
    statusEl.textContent = "Processing photo…";
    processImageFile(file).then(function(dataUri){
      var entry = {
        id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        category: $("#pfCategory").value,
        title: ($("#pfTitle").value || "").trim() || "Untitled Session",
        location: ($("#pfLocation").value || "").trim(),
        img: dataUri,
        addedAt: new Date().toISOString()
      };
      CUSTOM_PORTFOLIO.unshift(entry);
      statusEl.textContent = "Publishing to your live site…";
      return publishSite().then(function(res){
        if(res.ok){
          statusEl.className = "publish-status ok";
          statusEl.textContent = "Published — this photo is now live on your portfolio.";
        } else {
          CUSTOM_PORTFOLIO.shift();
          statusEl.className = "publish-status err";
          statusEl.textContent = publishStatusMessage(res);
        }
        submit.disabled = false;
        rerenderAdmin();
      });
    }).catch(function(){
      statusEl.className = "publish-status err";
      statusEl.textContent = "Couldn't process that image — try a different file.";
      submit.disabled = false;
    });
  }); }
  $all("[data-del]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.dataset.del;
      var idx = CUSTOM_PORTFOLIO.findIndex(function(p){ return p.id===id; });
      if(idx<0) return;
      var removed = CUSTOM_PORTFOLIO.splice(idx,1)[0];
      btn.closest(".photo-thumb").style.opacity = ".4";
      publishSite().then(function(res){
        if(!res.ok){ CUSTOM_PORTFOLIO.splice(idx,0,removed); }
        rerenderAdmin();
      });
    });
  });
}
function initDrawer(){
  var back = $("#drawerBack"); if(!back) return;
  back.addEventListener("click", function(){ openDrawerId=null; rerenderAdmin(); });
  $("#drawerClose").addEventListener("click", function(){ openDrawerId=null; rerenderAdmin(); });
  ["qPrice","qTravel","qDiscount","qTax"].forEach(function(id){ $("#"+id).addEventListener("input", computeCalc); });
  computeCalc();
  $("#sendQuote").addEventListener("click", function(){
    var b = findBooking(openDrawerId);
    b.quote = {
      price: parseFloat($("#qPrice").value)||0,
      travelFee: parseFloat($("#qTravel").value)||0,
      discountPct: parseFloat($("#qDiscount").value)||0,
      taxPct: parseFloat($("#qTax").value)||0,
      message: $("#qMessage").value,
      sentAt: new Date().toISOString()
    };
    b.status = "quoted";
    upsertBooking(b);
    rerenderAdmin();
  });
  var decline = $("#declineBooking");
  if(decline){ decline.addEventListener("click", function(){
    var b = findBooking(openDrawerId); b.status="declined"; upsertBooking(b); rerenderAdmin();
  }); }
}
function rerenderAdmin(){
  var main = $("main"); if(!main) return;
  main.innerHTML = renderAdminDashboard();
  initAdminDashboard();
}

/* ============================= AFTER-RENDER HOOKS ============================= */
function afterRender(path){
  var toggle = $("#navToggle");
  if(toggle){ toggle.addEventListener("click", function(){ var m=$("#mobileMenu"); m.hidden=!m.hidden; }); }
  $all("#mobileMenu a").forEach(function(a){ a.addEventListener("click", function(){ $("#mobileMenu").hidden=true; }); });

  if(path==="/") initHero();
  if(path==="/portfolio") initPortfolio();
  if(path==="/contact") initContact();
  if(path==="/book"){ resetOnEnterBooking(); initBooking(); }
  if(path==="/my-quote") initMyQuote();
  if(path==="/admin"){ if(!isAdmin()) initAdminGate(); else initAdminDashboard(); }

  $all('a[href="#/portfolio"][data-cat]').forEach(function(a){
    a.addEventListener("click", function(){ window.__pendingCatFilter = a.dataset.cat; portfolioFilter = a.dataset.cat; });
  });
}
var bookingEntered = false;
function resetOnEnterBooking(){
  if(!bookingEntered){ resetWizard(); bookingEntered = true; }
}
window.addEventListener("hashchange", function(){ if(location.hash.replace(/^#/,"")!=="/book"){ bookingEntered=false; } });

/* ============================= INIT ============================= */
if(!location.hash) location.hash = "#/";
render();

})();
</script>
